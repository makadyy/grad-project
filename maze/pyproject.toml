[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-rl-a3"
version = "0.1.0"
description = "Abstract cyber deception investigation maze and shielded rule policy"
requires-python = ">=3.10"
dependencies = ["gymnasium>=0.29,<2.0", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["maze_env", "policy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
