<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabyrinthAI Pipeline</title>
<link rel="stylesheet" href="common.css">
<style>
.stage { fill: var(--room); stroke: var(--line); stroke-width: 3; transition: all .4s; }
.stage.on { stroke: var(--accent); fill: color-mix(in srgb, var(--accent) 14%, var(--room)); }
.stage.done { stroke: var(--ok); fill: color-mix(in srgb, var(--ok) 16%, var(--room)); }
.stage.bad { stroke: var(--bad); fill: color-mix(in srgb, var(--bad) 14%, var(--room)); }
.packet { transition: transform .5s ease-in-out, fill .3s; }
.g { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.wire { stroke: var(--line); stroke-width: 4; }
.meter { transition: width .7s, fill .7s; }
</style></head>
<body><main id="app"></main>
<script src="common.js"></script>
<script>
const NAMES = ["Attacker", "Fake net", "Logs", "AI", "Lock", "Proof", "Screen"];
const X = i => 90 + i * 130, Y = 170;
let S;

function glyph(i, g) {
  const x = X(i), y = Y;
  const p = (t, a) => el(t, { ...a, class: "g" }, g);
  if (i === 0) { p("circle", { cx: x, cy: y - 8, r: 7 }); p("path", { d: `M${x - 14} ${y + 16} Q${x} ${y - 2} ${x + 14} ${y + 16}` }); }
  if (i === 1) { p("circle", { cx: x - 12, cy: y + 8, r: 5 }); p("circle", { cx: x + 12, cy: y + 8, r: 5 }); p("circle", { cx: x, cy: y - 10, r: 5 });
    p("path", { d: `M${x - 9} ${y + 6} L${x - 3} ${y - 6} M${x + 9} ${y + 6} L${x + 3} ${y - 6} M${x - 7} ${y + 8} H${x + 7}` }); }
  if (i === 2) p("path", { d: `M${x - 14} ${y - 10} H${x + 14} M${x - 14} ${y} H${x + 6} M${x - 14} ${y + 10} H${x + 14}` });
  if (i === 3) { p("ellipse", { cx: x, cy: y, rx: 18, ry: 11 }); p("circle", { cx: x, cy: y, r: 5 }); }
  if (i === 4) { p("rect", { x: x - 12, y: y - 2, width: 24, height: 17, rx: 3 }); p("path", { d: `M${x - 7} ${y - 2} V${y - 8} a7 7 0 0 1 14 0 V${y - 2}` }); }
  if (i === 5) { p("rect", { x: x - 17, y: y - 6, width: 12, height: 12, rx: 2 }); p("rect", { x: x + 5, y: y - 6, width: 12, height: 12, rx: 2 }); p("path", { d: `M${x - 5} ${y} H${x + 5}` }); }
  if (i === 6) { p("rect", { x: x - 17, y: y - 12, width: 34, height: 24, rx: 3 }); p("path", { d: `M${x - 9} ${y + 5} V${y} M${x} ${y + 5} V${y - 6} M${x + 9} ${y + 5} V${y - 2}` }); }
}

function build() {
  svg.innerHTML = "";
  S = { st: [] };
  el("line", { x1: X(0), y1: Y, x2: X(6), y2: Y, class: "wire" });
  NAMES.forEach((n, i) => {
    S.st.push(el("circle", { cx: X(i), cy: Y, r: 40, class: "stage" }));
    glyph(i, el("g"));
    el("text", { x: X(i), y: Y + 70 }, svg, n);
  });
  el("text", { x: 480, y: 290 }, svg, "Threat");
  el("rect", { x: 90, y: 305, width: 780, height: 16, rx: 8, fill: css("--dim") });
  S.meter = el("rect", { x: 90, y: 305, width: 0, height: 16, rx: 8, fill: css("--ok"), class: "meter" });
  S.badge = el("text", { x: X(3), y: 80, class: "big", fill: css("--mute") }, svg, "");
  S.packet = el("circle", { cx: 0, cy: 0, r: 11, fill: css("--bad"), class: "packet" });
  S.packet.style.transition = "none"; S.packet.style.transform = `translate(${X(0)}px, ${Y}px)`;
}

async function travel(i) { S.packet.style.transition = ""; S.packet.style.transform = `translate(${X(i)}px, ${Y}px)`; await sleep(600); }

async function play(data) {
  await sleep(500);
  for (const s of data.steps) {
    $("cap").textContent = s.caption;
    S.packet.style.transition = "none"; S.packet.style.transform = `translate(${X(0)}px, ${Y}px)`;
    void S.packet.getBoundingClientRect();
    const th = threat(s);
    S.packet.setAttribute("fill", threatColor(th));
    for (const i of [1, 2, 3]) { S.st[i].classList.add("on"); await travel(i); S.st[i].classList.remove("on"); }
    S.st[3].classList.add("on");
    S.meter.setAttribute("width", 780 * th); S.meter.setAttribute("fill", threatColor(th));
    S.badge.textContent = WORD[s.executed]; S.badge.setAttribute("fill", s.contained ? css("--bad") : css("--accent"));
    await sleep(700);
    S.st[3].classList.remove("on");
    if (s.contained) {
      for (const i of [4, 5, 6]) { S.st[i].classList.add("on"); await travel(i); }
      S.st.forEach((c, i) => { c.classList.remove("on"); if (i) c.classList.add(i === 4 ? "bad" : "done"); });
      break;
    }
    await sleep(500);
  }
  endCaption(data, "Caught. Locked out and recorded.");
}
mount({ build, play, viewBox: "0 0 960 380" });
</script></body></html>
