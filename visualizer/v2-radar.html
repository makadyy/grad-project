<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabyrinthAI Radar</title>
<link rel="stylesheet" href="common.css">
<style>
.ring { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 4 6; transition: stroke .5s; }
.ring.open { stroke: var(--accent); stroke-dasharray: none; }
.ring.caught { stroke: var(--bad); stroke-dasharray: none; }
.blip { transition: transform 1s cubic-bezier(.5,0,.2,1); }
.halo { fill: none; stroke-width: 4; transition: stroke .6s; }
.ping { fill: none; stroke: var(--bad); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 1.4s ease-out infinite; }
@keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.4); opacity: 0; } }
</style></head>
<body><main id="app"></main>
<script src="common.js"></script>
<script>
const C = { x: 480, y: 225 }, R = [200, 155, 110, 65];
let S;
const pos = (ring, ang) => [C.x + R[ring] * Math.cos(ang), C.y + R[ring] * Math.sin(ang)];

function build() {
  svg.innerHTML = "";
  S = { rings: [], ring: 0, ang: -2.6 };
  S.rings = R.map(r => el("circle", { cx: C.x, cy: C.y, r, class: "ring" }));
  el("text", { x: C.x, y: C.y - R[0] - 10 }, svg, "Fake network");
  const sweep = el("g");
  el("line", { x1: C.x, y1: C.y, x2: C.x + R[0] + 14, y2: C.y, stroke: css("--accent"), "stroke-width": 3, opacity: .5 }, sweep);
  el("animateTransform", { attributeName: "transform", type: "rotate", from: `0 ${C.x} ${C.y}`, to: `360 ${C.x} ${C.y}`, dur: "3.5s", repeatCount: "indefinite" }, sweep);
  S.halo = el("circle", { cx: C.x, cy: C.y, r: 36, class: "halo", stroke: css("--ok") });
  el("circle", { cx: C.x, cy: C.y, r: 30, fill: css("--card") });
  el("ellipse", { cx: C.x, cy: C.y, rx: 20, ry: 11, fill: "none", stroke: css("--ink"), "stroke-width": 2.5 });
  el("circle", { cx: C.x, cy: C.y, r: 6, fill: css("--accent") });
  el("text", { x: C.x, y: C.y + 56 }, svg, "AI");
  S.badge = el("text", { x: 130, y: 220, class: "big", fill: css("--mute") }, svg, "");
  S.badge.setAttribute("text-anchor", "middle");
  S.blip = el("g", { class: "blip" });
  S.bc = el("circle", { r: 12, fill: css("--bad"), stroke: css("--card"), "stroke-width": 3 }, S.blip);
  const [x0, y0] = pos(0, S.ang);
  S.blip.style.transition = "none"; S.blip.style.transform = `translate(${x0}px, ${y0}px)`;
  S.caught = el("text", { x: 830, y: 220, class: "big", fill: css("--bad"), opacity: 0 }, svg, "CAUGHT");
  S.caught.style.fontSize = "28px";
}

function go(ring) {
  S.ring = ring; S.ang += 0.9;
  const [x, y] = pos(ring, S.ang);
  S.blip.style.transition = ""; S.blip.style.transform = `translate(${x}px, ${y}px)`;
}

async function play(data) {
  S.rings[0].classList.add("open");
  await sleep(800);
  for (const s of data.steps) {
    $("cap").textContent = s.caption;
    const th = threat(s);
    S.halo.setAttribute("stroke", threatColor(th));
    S.halo.setAttribute("stroke-width", 3 + th * 9);
    S.badge.textContent = WORD[s.executed];
    S.badge.setAttribute("fill", s.contained ? css("--bad") : css("--accent"));
    if (s.executed === "DEEPEN" && S.ring < R.length - 1) { go(S.ring + 1); S.rings[S.ring].classList.add("open"); }
    else go(S.ring);
    if (s.contained) {
      await sleep(1000);
      S.rings.forEach((r, i) => { if (i <= S.ring) r.classList.add("caught"); });
      S.bc.setAttribute("fill", css("--mute"));
      const [x, y] = pos(S.ring, S.ang);
      el("circle", { cx: x, cy: y, r: 22, class: "ping" });
      S.caught.setAttribute("opacity", 1);
      break;
    }
    await sleep(1700);
  }
  endCaption(data, "Caught. The AI locked the attacker out.");
}
mount({ build, play, viewBox: "0 0 960 450" });
</script></body></html>
