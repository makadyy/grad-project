<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabyrinthAI Versions</title>
<link rel="stylesheet" href="common.css">
<style>
h1 { font-size: 22px; margin: 0 0 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
.tile { position: relative; border: 1px solid var(--line); border-radius: 14px; background: var(--card); overflow: hidden; }
.frame { position: relative; aspect-ratio: 16 / 8; overflow: hidden; }
.frame iframe { width: 200%; height: 200%; border: 0; transform: scale(.5); transform-origin: top left; pointer-events: none; }
.tile a { position: absolute; inset: 0; z-index: 2; }
.num { position: absolute; top: 10px; left: 10px; z-index: 3; width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
</style></head>
<body><main>
  <h1>Pick a version</h1>
  <div class="grid" id="grid"></div>
</main>
<script>
const V = ["v1-rooms", "v2-radar", "v3-pipeline", "v4-labyrinth", "v5-dial", "v6-network"];
document.getElementById("grid").innerHTML = V.map((v, i) => `
  <div class="tile"><span class="num">${i + 1}</span>
    <div class="frame"><iframe src="/${v}.html?embed=1&auto=skilled" loading="lazy" title="Version ${i + 1}"></iframe></div>
    <a href="/${v}.html" aria-label="Open version ${i + 1}"></a></div>`).join("");
</script></body></html>
