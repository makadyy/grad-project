<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabyrinthAI Versions</title>
<link rel="stylesheet" href="common.css">
<style>
body { overflow: auto; }
main { max-width: none; height: auto; display: block; padding: 12px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
.frame { position: relative; aspect-ratio: 960 / 470; overflow: hidden; }
.frame iframe { width: 200%; height: 200%; border: 0; transform: scale(.5); transform-origin: top left; pointer-events: none; }
.tile a { position: absolute; inset: 0; z-index: 2; }
.num { position: absolute; top: 8px; left: 8px; z-index: 3; width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; }
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
</style></head>
<body><main>
  <div class="grid" id="grid"></div>
</main>
<script>
const V = ["v1-rooms", "v2-radar", "v3-pipeline", "v4-labyrinth", "v5-dial", "v6-network", "v7-firewall"];
document.getElementById("grid").innerHTML = V.map((v, i) => `
  <div class="tile"><span class="num">${i + 1}</span>
    <div class="frame"><iframe src="/${v}.html?embed=1&auto=skilled&loop=1" title="Version ${i + 1}"></iframe></div>
    <a href="/${v}.html" aria-label="Open version ${i + 1} full size"></a></div>`).join("");
</script></body></html>
